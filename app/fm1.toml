# nullwave's build settings (tools/build.py)
name = "nullwave"              # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_60"          # package identity (each firmware its own): dev FM-1_6000, releases FM-1_60XXYYZZ
usb_manufacturer = "nullwave"
usb_product = "nullwave"
font_full = ["L", "M"]   # lower case in the big fonts, for the name
o2 = []                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_central = true             # and the FM-1 connects to Bluetooth MIDI devices too
companion = true               # the companion services: the saved settings as a file for a page (app.h APP_FILE_OBJS)
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "a six-channel groovebox for the FM-1"
repo = "https://github.com/nullwave-cc/fm1"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, with engines from Felucca-Engines."                   # a sentence for the installer's footer: what your firmware is built from
# firmware.json, for firmware hubs (docs/FIRMWARE-JSON.md): the build writes it from these and the keys above
author = "nullwave"      # who made it
description = "Six equal channels, each a synth, a drum kit, a sampler or MIDI out, sharing one voice pool, with a step sequencer and scales on the keys."
tags = ["groovebox", "synth", "sequencer", "drum-machine", "sampler"]    # from the list in docs/FIRMWARE-JSON.md; the build refuses another
install = "https://nullwave.cc/fm1/install/"   # the page that installs it
site = "https://nullwave.cc/fm1/"
screenshot = "app/docs/img/screen-playing.png"   # for the hubs' cards: a square PNG, at least 240 x 240, in your repository
