# SPDX-License-Identifier: MPL-2.0
# Host build and tests on pull requests and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python with Pillow and FriBiDi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0
          python3 -m pip install --user Pillow
      - name: Host simulator tests
        run: sh tests/run_tests.sh
