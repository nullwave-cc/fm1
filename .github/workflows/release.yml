# SPDX-License-Identifier: MPL-2.0
# A release: a version tag (v0.1.0) builds the package (nullwave-0.1.0.fwsc) and the site's FM-1 pages (the installer,
# the emulator, the quick start, the manual) and makes a draft GitHub release with both and the CHANGELOG's entry for
# that version. Nothing is published: the draft waits for review, and the pages go to nullwave.cc by docs/PUBLISH.md.
name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Version
        run: |
          set -eu
          v="${GITHUB_REF_NAME#v}"
          printf '%s' "$v" | grep -Eq '^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$'
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Python with Pillow and FriBiDi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0
          python3 -m pip install --user Pillow
      - uses: actions/cache@v4
        with:
          path: base/.toolchain/downloads
          key: jieli-${{ runner.os }}-${{ hashFiles('base/tools/toolchain.lock') }}
      - name: Pinned JieLi toolchain and SDK files
        run: ./build.sh --setup
      - name: Emscripten 6.0.10
        run: |
          set -eu
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - name: Tests
        run: sh tests/run_tests.sh
      - name: Package, emulator and pages
        run: |
          set -eu
          set +u; . "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
          ./build.sh --release "$VERSION"
          ./build.sh --web --release "$VERSION"
          python3 base/tools/make_site.py app "app/build/nullwave-$VERSION.fwsc" "$VERSION" _site
          mv _site/install _site/installer
          python3 tools/brand.py _site
          python3 tools/quick_start.py _site "$VERSION"
          python3 tools/site_look.py _site "$VERSION" "nullwave-$VERSION.fwsc"
          # the site's FM-1 pages, ready for nullwave-cc/site's fm1/ (docs/PUBLISH.md); the promo screens beside
          mkdir -p dist
          tar -czf "dist/nullwave-fm1-site-$VERSION.tar.gz" -C _site .
          tar -czf "dist/nullwave-fm1-screens-$VERSION.tar.gz" -C docs/img/promo .
          cp "app/build/nullwave-$VERSION.fwsc" dist/
      - name: No private paths in what is published
        run: |
          set -eu
          python3 tools/publish_site.py --check _site
          python3 tools/publish_site.py --check dist
      - name: Release notes (CHANGELOG.md, this version's entry)
        run: |
          set -eu
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "nullwave $VERSION" --notes-file dist/notes.md \
            "dist/nullwave-$VERSION.fwsc" "dist/nullwave-fm1-site-$VERSION.tar.gz" \
            "dist/nullwave-fm1-screens-$VERSION.tar.gz"
